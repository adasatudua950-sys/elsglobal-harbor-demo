        function tarikDataTanpaCache(id_kategori, desc) {
            $("#dataProduk").html(loads);

            let xmlHttpRequest = new XMLHttpRequest();
            let url = `https://openapi.bukaolshop.net/v1/app/produk?token=${token}&id_kategori=${id_kategori}&total_data=${data_page}`;
            xmlHttpRequest.open("GET", url, true);
            xmlHttpRequest.onreadystatechange = function () {
                if (xmlHttpRequest.readyState == 4 && xmlHttpRequest.status == 200) {
                    let res = JSON.parse(xmlHttpRequest.responseText);
                    if (res && res.data && res.data.length > 0) {
                        dataProduk = res.data;
                        resGetData(dataProduk, desc);
                    } else {
                        resGetData(null, desc);
                    }
                }
            }
            xmlHttpRequest.send();
        }

        function resGetData(data, desc) {
            if (data == null) {
                $("#dataProduk").html(produkNone);
            } else {
                $("#dataProduk").html(`<div class="animate__animated animate__fadeIn d-grid-1" id="isiProduk"></div>`);
                loopProduk(data, desc);
                dataProduk = data;
                dataDesc = desc;
            }
        }

        function loopProduk(data, desc) {
            if (!data || data.length == 0) {
                $("#dataProduk").html(produkNone);
                return;
            }

            let sortedData = [...data];

            if (urutanProduk == "Termurah") {
                sortedData.sort((a, b) => parseFloat(a.harga_produk) - parseFloat(b.harga_produk));
            } else if (urutanProduk == "Termahal") {
                sortedData.sort((a, b) => parseFloat(b.harga_produk) - parseFloat(a.harga_produk));
            } else if (urutanProduk == "A-Z") {
                sortedData.sort((a, b) => a.nama_produk.localeCompare(b.nama_produk));
            } else if (urutanProduk == "Z-A") {
                sortedData.sort((a, b) => b.nama_produk.localeCompare(a.nama_produk));
            }

            sortedData.sort((a, b) => {
                let aTerlaris = daftarProdukTerlaris.includes(String(a.id_produk)) ? -1 : 0;
                let bTerlaris = daftarProdukTerlaris.includes(String(b.id_produk)) ? -1 : 0;
                return aTerlaris - bTerlaris;
            });

            dataProduk = sortedData;
            $("#isiProduk").html("");

            $.each(sortedData, function (i, v) {
                var nama_produk = v.nama_produk ? v.nama_produk : "";
                var harga_produk = formatRupiah(v.harga_produk);
                let hargaAsli = (v.harga_produk_asli != "0") ? `<span class="text-danger text-decoration-line-through ms-2" style="font-size: 10px;">${v.harga_produk_asli}</span>` : ``;

                var isTerlaris = daftarProdukTerlaris.includes(String(v.id_produk));
                var isGangguan = daftarProdukGangguan.includes(String(v.id_produk));

                var statusBadgeHtml = "";
                if (isGangguan) {
                    statusBadgeHtml = `<span class="badge-gangguan-box"><i class="fa-solid fa-triangle-exclamation me-1"></i>E-Wallet Gangguan</span>`;
                } else if (isTerlaris) {
                    statusBadgeHtml = `<span class="badge-terlaris-modern"><i class="fa-solid fa-fire me-1"></i>E-Wallet Terlaris</span>`;
                } else {
                    statusBadgeHtml = `<span class="badge-berkualitas-modern"><i class="fa-solid fa-circle-check me-1"></i>E-Wallet Detikan</span>`;
                }

                $("#isiProduk").append(`
                <div class="bg-produk animate__animated animate__fadeIn" id="bg-prod-${i}" onclick="nextDetail('${v.id_produk}', \`${encodeURIComponent(v.deskripsi_panjang || '')}\`)" data-bs-toggle="offcanvas" data-bs-target="#detailCanv" aria-controls="detailCanv" style="cursor: pointer;">
                    <div class="text-start">
                        <p class="fw-bold text-dark mb-2" style="font-size: 12px; line-height: 1.35;">${nama_produk}</p>

                        <div class="d-flex align-items-center justify-content-between pt-1.5 border-top border-light">
                            <div class="product-price-box">${harga_produk} ${hargaAsli}</div>
                            <div>
                                ${statusBadgeHtml}
                            </div>
                        </div>
                    </div>
                </div>
                `);
            });
        }

        function nextDetail(idProduk, encodedDesk) {
            var v = dataProduk.find(item => String(item.id_produk) === String(idProduk));
            if (!v) return;

            var nama_produk = v.nama_produk ? v.nama_produk : "";
            var harga_produk = formatRupiah(v.harga_produk);
            var no = $("#nomoId").val();
            let nomor = (no == "") ? `<span class="text-danger">Masukkan nomor tujuan dahulu...</span>` : no;
            let saldoLabel = getEwalletSaldoLabel(nama_produk, currentKategoriNama);

            let rawDesk = decodeURIComponent(encodedDesk);
            let cleanDesk = bersihkanDeskripsi(rawDesk);

            let btn = (no != "") ? `
            <div class="btn-pay-mec-wide my-bg text-white fw-bold" style="font-size: 13px;" onclick="getBayarMEC('${v.id_produk}', \`${encodeURIComponent(nama_produk)}\`, '${v.harga_produk}')">
                <i class="fa-solid fa-coins"></i>
                <span>Tukar MEC jadi ${saldoLabel}</span>
            </div>` : ``;

            $("#bodyCanv").html(`
                <div class="text-start">
                    <p class="fw-bold text-dark" style="font-size: 13.5px; line-height: 1.3;">${nama_produk}</p>
                </div>
                <div class="p-2.5 mt-2 mb-2.5 borad-8" style="background-color: #f8fafc; border: 1px dashed #cbd5e1;">
                    <p class="fw-semibold text-secondary" style="font-size: 10.5px;">Deskripsi Produk :</p>
                    <div class="mt-1">
                        <p class="text-dark" style="font-size: 11.5px; white-space: pre-line; line-height: 1.4;">${cleanDesk}</p>
                    </div>
                </div>

                <div class="bg-light p-2.5 borad-8 mb-3 border">
                    <div class="d-flex justify-content-between align-items-center py-1 border-bottom" style="font-size: 11.5px;">
                        <span class="text-secondary fw-semibold"><i class="fa-solid fa-wallet me-1 text-primary"></i> Nomor Tujuan :</span>
                        <span class="fw-bold text-dark font-monospace">${nomor}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center pt-1.5" style="font-size: 12px;">
                        <span class="text-secondary fw-semibold"><i class="fa-solid fa-tag me-1 text-success"></i> Harga Produk :</span>
                        <span class="fw-bold f-14 text-success">${harga_produk}</span>
                    </div>
                </div>

                <div class="mt-2">
                    ${btn}
                    <div class="mt-2">
                        <div class="w-100 bg-light border p-2.5 borad-10 text-center shadow-sm" data-bs-dismiss="offcanvas" aria-label="Close" style="cursor: pointer;">
                            <p class="text-secondary fw-semibold" style="font-size: 12px;">Kembali</p>
                        </div>
                    </div>
                </div>
            `);
        }

        function getBayarMEC(idProduk, encodedNamaProduk, hargaProduk) {
            var no = $("#nomoId").val().trim();
            var namaProduk = decodeURIComponent(encodedNamaProduk);
            var hargaAngka = parseFloat(hargaProduk) || 0;

            const params = new URLSearchParams({
                id_produk: String(idProduk),
                produk: namaProduk,
                harga: String(hargaAngka),
                tujuan: no
            });

            window.location.href = "index.html?" + params.toString();
        }

        $("#search").on("input", function () {
            var value = $(this).val().toLowerCase();
            $("#isiProduk .bg-produk").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        $("#searchKategori").on("input", function () {
            var value = $(this).val().toLowerCase();
            $("#listKategoriContainer .card-kategori").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        function defaultData() {
            urutanProduk = "Termurah";
            $(".dropdown-item").removeClass("my-color");
            $("#pil-" + urutanProduk).addClass("my-color");
            $("#namaPil").html(urutanProduk);
            $("#search").val("");
        }

        function rubahData(nama) {
            $(".dropdown-item").removeClass("my-color");
            $("#pil-" + nama).addClass("my-color");
            $("#namaPil").html(nama);
            urutanProduk = nama;
            if (dataProduk != null) {
                loopProduk(dataProduk, dataDesc);
            }
        }

        function formatRupiah(angka) {
            var formatter = new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                minimumFractionDigits: 0,
            });
            return formatter.format(angka).replace(/IDR/g, "").trim();
        }

        renderDaftarKategori();
        defaultData();
    </script>
</body>
</html>
