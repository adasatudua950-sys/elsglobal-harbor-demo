        :root {

        .ping {
            --uib-size: 3.5rem;
            --uib-speed: 2s;
            --uib-color: #38bdf8;
            position: relative;
            height: var(--uib-size);
            width: var(--uib-size);
        }

        .ping::before,
        .ping::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            border-radius: 50%;
            background-color: var(--uib-color);
            animation: pulse7132 var(--uib-speed) linear infinite;
            transform: scale(0);
            opacity: 0;
        }

        .ping::after {
            animation-delay: calc(var(--uib-speed) / -2);
        }

        @keyframes pulse7132 {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        let dataProduk = null;
        let dataDesc = null;
        let urutanProduk = "Termurah";
        let currentCatData = [];
        let currentOperatorKey = "";
        let isFilterOpen = true;

        function toggleFilterMenu() {
            if (isFilterOpen) {
                $("#collapseFilterBody").slideUp(150);
                $("#textToggleBtn").text("Tampilkan Menu");
                isFilterOpen = false;
            } else {
                $("#collapseFilterBody").slideDown(150);
                $("#textToggleBtn").text("Sembunyikan Menu");
                isFilterOpen = true;
            }
        }

        function bersihkanDeskripsi(text) {
            if (!text) return "-";
            let temp = document.createElement("div");
            let formatText = text.replace(/<br\s*[\/]?>/gi, '\n')
                                 .replace(/<\/p>/gi, '\n')
                                 .replace(/&lt;br\s*[\/]?-&gt;/gi, '\n');
            temp.innerHTML = formatText;
            let hasilText = temp.textContent || temp.innerText || "";
            return hasilText.trim();
        }

        $("#imgContact").attr("src", iconPilihan[0].contact);
        $("#imgScan").attr("src", iconPilihan[0].scan);
        $("#imgSavedContacts").attr("src", iconPilihan[0].contact);

        function getContact() { window.location.href = urlToko + "/ambil_kontak"; }
        function getScan() { window.location.href = urlToko + "/scan"; }

        $("#chkSimpanPelanggan").on("change", function () {
            if ($(this).is(":checked")) { $("#boxInputNama").removeClass("d-none"); }
            else { $("#boxInputNama").addClass("d-none"); }
        });

        function simpanDataPelangganKeLocal(nomorHp, namaPelanggan) {
            if (!nomorHp || nomorHp.length < 5) return;
            let listSimpan = JSON.parse(localStorage.getItem("payfazz_pelanggan") || "[]");
            let indexCari = listSimpan.findIndex(item => item.nomor === nomorHp);
            if (indexCari !== -1) { listSimpan[indexCari].nama = namaPelanggan; }
            else { listSimpan.push({ nomor: nomorHp, nama: namaPelanggan }); }
            localStorage.setItem("payfazz_pelanggan", JSON.stringify(listSimpan));
        }

        function hapusPelangganTersimpan(nomorHp) {
            let listSimpan = JSON.parse(localStorage.getItem("payfazz_pelanggan") || "[]");
            listSimpan = listSimpan.filter(item => item.nomor !== nomorHp);
            localStorage.setItem("payfazz_pelanggan", JSON.stringify(listSimpan));
            openSavedContactsModal();
        }

        function openSavedContactsModal() {
            let listSimpan = JSON.parse(localStorage.getItem("payfazz_pelanggan") || "[]");
            let htmlList = "";
            if (listSimpan.length === 0) {
                htmlList = `<p class="text-center py-3" style="font-size: 12px; color: var(--text-muted);">Belum ada pelanggan tersimpan.</p>`;
            } else {
                $.each(listSimpan, function (i, item) {
                    htmlList += `
                        <div class="d-flex justify-content-between align-items-center p-2 mb-1.5 borad-8" style="background: rgba(15, 25, 48, 0.9); border: 1px solid rgba(56, 189, 248, 0.2);">
                            <div style="cursor: pointer; flex-grow: 1;" onclick="pilihPelangganTersimpan('${item.nomor}', '${item.nama}')">
                                <p class="fw-bold text-white" style="font-size: 12px;">${item.nama ? item.nama : 'Tanpa Nama'}</p>
                                <p style="font-size: 11px; color: var(--text-muted);">${item.nomor}</p>
                            </div>
                            <div class="d-flex gap-1.5 align-items-center">
                                <span class="badge bg-primary px-2 py-1" style="font-size: 10px; cursor: pointer;" onclick="pilihPelangganTersimpan('${item.nomor}', '${item.nama}')">Pilih</span>
                                <button class="btn btn-sm btn-outline-danger py-0 px-1.5" onclick="hapusPelangganTersimpan('${item.nomor}')"><i class="fa-solid fa-trash-can" style="font-size: 10px;"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
            $("#listPelangganTersimpanBody").html(htmlList);
            var myModal = new bootstrap.Modal(document.getElementById('modalPelangganTersimpan'));
            myModal.show();
        }

        function pilihPelangganTersimpan(nomor, nama) {
            $("#nomoId").val(nomor);
            if (nama && nama !== "null" && nama !== "") {
                $("#chkSimpanPelanggan").prop("checked", true);
                $("#boxInputNama").removeClass("d-none");
                $("#namaPelangganInput").val(nama);
            }
            cekInputan(2);
            var modalEl = document.getElementById('modalPelangganTersimpan');
            var modalObj = bootstrap.Modal.getInstance(modalEl);
            modalObj.hide();
        }

        function lanjutKeFullLayar() {
            var noHp = $("#nomoId").val();
            var isSimpan = $("#chkSimpanPelanggan").is(":checked");
            var namaPlg = $("#namaPelangganInput").val();

            if (isSimpan && namaPlg.trim() !== "") {
                simpanDataPelangganKeLocal(noHp, namaPlg);
            }

            $("#displayNomorAktif").html(noHp + (namaPlg ? " (" + namaPlg + ")" : ""));
            $("#sectionInputPage").addClass("d-none");
            $("#boxPilihan").removeClass("d-none");

            tarikSemuaDataLangsung();
        }

        function kembaliKeInputNomor() {
            $("#boxPilihan").addClass("d-none");
            $("#sectionInputPage").removeClass("d-none");
        }

        async function tarikSemuaDataLangsung() {
            if (!currentCatData || currentCatData.length === 0) return;
            $("#dataProduk").html(loads);

            let promises = currentCatData.map(async (v) => {
                try {
                    let url = `https://openapi.bukaolshop.net/v1/app/produk?token=${token}&id_kategori=${v.id_kategori}&total_data=${data_page}`;
                    let response = await fetch(url);
                    let res = await response.json();
                    if (res && res.data && res.data.length > 0) return res.data;
                } catch (e) {}
                return [];
            });

            let results = await Promise.all(promises);
            let gabunganProduk = results.flat();

            if (gabunganProduk.length > 0) {
                let uniqueProduk = [];
                gabunganProduk.forEach(p => {
                    if (!uniqueProduk.some(item => item.id_produk === p.id_produk)) uniqueProduk.push(p);
                });
                dataProduk = uniqueProduk;
                dataDesc = currentCatData[0].desc;
                resGetData(dataProduk, dataDesc);
            } else {
                resGetData(null, "");
            }
        }

        function resGetData(data, desc) {
            if (data == null || data.length === 0) {
                $("#dataProduk").html(produkNone);
            } else {
                $("#dataProduk").html(`<div class="animate__animated animate__fadeIn d-grid-1" id="isiProduk"></div>`);
                loopProduk(data, desc);
            }
        }

        function loopProduk(data, desc) {
            if (!data || data.length == 0) {
                $("#dataProduk").html(produkNone);
                return;
            }

            let sortedData = [...data];
            if (urutanProduk == "Termurah") sortedData.sort((a, b) => parseFloat(a.harga_produk) - parseFloat(b.harga_produk));
            else if (urutanProduk == "Termahal") sortedData.sort((a, b) => parseFloat(b.harga_produk) - parseFloat(a.harga_produk));
            else if (urutanProduk == "A-Z") sortedData.sort((a, b) => a.nama_produk.localeCompare(b.nama_produk));
            else if (urutanProduk == "Z-A") sortedData.sort((a, b) => b.nama_produk.localeCompare(a.nama_produk));

            sortedData.sort((a, b) => {
                let aTerlaris = daftarProdukTerlaris.includes(String(a.id_produk)) ? -1 : 0;
                let bTerlaris = daftarProdukTerlaris.includes(String(b.id_produk)) ? -1 : 0;
                return aTerlaris - bTerlaris;
            });

            dataProduk = sortedData;
            $("#isiProduk").html("");

            $.each(sortedData, function (i, v) {
                var nama_produk = v.nama_produk ? v.nama_produk : "";
                var harga_produk = formatRupiah(v.harga_produk);
                let hargaAsli = (v.harga_produk_asli != "0") ? `<span class="text-danger text-decoration-line-through ms-2" style="font-size: 10px;">${v.harga_produk_asli}</span>` : ``;

                var isTerlaris = daftarProdukTerlaris.includes(String(v.id_produk));
                var isGangguan = daftarProdukGangguan.includes(String(v.id_produk));

                var statusBadgeHtml = "";
                if (isGangguan) {
                    statusBadgeHtml = `<span class="badge-gangguan-box"><i class="fa-solid fa-triangle-exclamation me-1"></i>Pulsa Reguler Gangguan</span>`;
                } else if (isTerlaris) {
                    statusBadgeHtml = `<span class="badge-terlaris-modern"><i class="fa-solid fa-fire me-1"></i>Pulsa Reguler Terlaris</span>`;
                } else {
                    statusBadgeHtml = `<span class="badge-berkualitas-modern"><i class="fa-solid fa-circle-check me-1"></i>Pulsa Reguler Detikan</span>`;
                }

                $("#isiProduk").append(`
                <div class="bg-produk animate__animated animate__fadeIn" id="bg-prod-${i}" onclick="nextDetail('${v.id_produk}', \`${encodeURIComponent(v.deskripsi_panjang || '')}\`)" data-bs-toggle="offcanvas" data-bs-target="#detailCanv" aria-controls="detailCanv" style="cursor: pointer;">
                    <div class="text-start">
                        <p class="fw-bold text-white mb-2" style="font-size: 12px; line-height: 1.35;">${nama_produk}</p>

                        <div class="d-flex align-items-center justify-content-between pt-1.5" style="border-top: 1px solid rgba(148, 163, 184, 0.14);">
                            <div class="product-price-box">${harga_produk} ${hargaAsli}</div>
                            <div>
                                ${statusBadgeHtml}
                            </div>
                        </div>
                    </div>
                </div>
                `);
            });
        }

        function nextDetail(idProduk, encodedDesk) {
            var v = dataProduk.find(item => String(item.id_produk) === String(idProduk));
            if (!v) return;

            var nama_produk = v.nama_produk ? v.nama_produk : "";
            var harga_produk = formatRupiah(v.harga_produk);
            var no = $("#nomoId").val();
            let nomor = (no == "") ? `<span class="text-danger">Masukkan nomor dahulu...</span>` : no;

            let rawDesk = decodeURIComponent(encodedDesk);
            let cleanDesk = bersihkanDeskripsi(rawDesk);

            let btn = (no != "") ? `
            <div class="row g-1.5">
                <div class="col-12">
                    <div class="w-100 my-bg p-2 borad-8 text-center text-white shadow-sm" onclick="getBayarMEC('${v.id_produk}', \`${encodeURIComponent(nama_produk)}\`, '${v.harga_produk}')" style="cursor: pointer;">
                        <p class="text-white fw-bold" style="font-size: 12px;"><i class="fa-solid fa-coins me-1"></i> Bayar Pakai MEC</p>
                    </div>
                </div>
            </div>` : ``;

            $("#bodyCanv").html(`
                <div class="text-start">
                    <p class="fw-bold text-white" style="font-size: 13.5px; line-height: 1.3;">${nama_produk}</p>
                </div>
                <div class="p-2 mt-2 mb-2 borad-8" style="background-color: rgba(9, 17, 34, 0.85); border: 1px dashed rgba(56, 189, 248, 0.35);">
                    <p class="fw-semibold" style="font-size: 10px; color: var(--text-muted);">Deskripsi Produk :</p>
                    <div class="mt-1">
                        <p class="text-white" style="font-size: 11px; white-space: pre-line; line-height: 1.35;">${cleanDesk}</p>
                    </div>
                </div>

                <div class="p-2.5 borad-8 mb-2" style="background: rgba(9, 17, 34, 0.75); border: 1px solid rgba(148, 163, 184, 0.2);">
                    <div class="d-flex justify-content-between align-items-center py-1" style="font-size: 11.5px; border-bottom: 1px solid rgba(148, 163, 184, 0.14);">
                        <span class="fw-semibold" style="color: var(--text-muted);"><i class="fa-solid fa-phone-volume me-1 text-info"></i> Nomor Tujuan :</span>
                        <span class="fw-bold text-white font-monospace">${nomor}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center pt-1.5" style="font-size: 12px;">
                        <span class="fw-semibold" style="color: var(--text-muted);"><i class="fa-solid fa-tag me-1 text-info"></i> Harga Produk :</span>
                        <span class="fw-bold f-14" style="color: #38bdf8;">${harga_produk}</span>
                    </div>
                </div>

                <div class="mt-2">
                    ${btn}
                    <div class="mt-1.5">
                        <div class="w-100 p-2 borad-8 text-center shadow-sm" style="background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(148, 163, 184, 0.22); cursor: pointer;" data-bs-dismiss="offcanvas" aria-label="Close">
                            <p class="fw-semibold" style="font-size: 12px; color: #cbd5e1;">Kembali</p>
                        </div>
                    </div>
                </div>
            `);
        }

        function getBayarMEC(idProduk, encodedNamaProduk, hargaProduk) {
            var no = $("#nomoId").val().trim();
            var namaProduk = decodeURIComponent(encodedNamaProduk);
            var hargaAngka = parseFloat(hargaProduk) || 0;

            const params = new URLSearchParams({
                id_produk: String(idProduk),
                produk: namaProduk,
                harga: String(hargaAngka),
                tujuan: no
            });

            window.location.href = "index.html?" + params.toString();
        }

        $("#search").on("input", function () {
            var value = $(this).val().toLowerCase();
            $("#isiProduk .bg-produk").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        let noX, noY, opera;

        function clearData() {
            var data = $("#dataProduk").html();
            if (data != loadAwal) { $("#dataProduk").html(loadAwal); }
            $("#boxPilihan").addClass("d-none");
            $("#boxBtnLanjut").addClass("d-none");
            $("#textTop").html("");
            $("#imgTop").attr("src", iconPilihan[0].signal);
            $("#imgTop").addClass("my-bg p-1 text-white");
            noX = ""; opera = "";
            currentCatData = [];
            currentOperatorKey = "";
        }

        function cekStr(a) {
            let b;
            if (a.substr(0, 2) == "62") { b = "0" + a.substr(2, 20); return b; }
            else if (a.substr(0, 3) == "+62") { b = "0" + a.substr(3, 20); return b; }
            else { return a; }
        }

        function cekNomorUlang(x, y) {
            if (y >= "085154" && y <= "085180") {
                loadOperator("BYU");
            } else if (['0811','0812','0813','0821','0822','0852','0853','0823','0851'].includes(x)) {
                loadOperator("TSEL");
            } else if (['0814','0815','0816','0855','0856','0857','0858'].includes(x)) {
                loadOperator("ISAT");
            } else if (['0818','0817','0819','0859','0877','0878'].includes(x)) {
                loadOperator("XL");
            } else if (['0838','0831','0832','0833'].includes(x)) {
                loadOperator("AXIS");
            } else if (['0895','0896','0897','0898','0899'].includes(x)) {
                loadOperator("THREE");
            } else if (['0881','0882','0883','0884','0885','0886','0887','0888','0889'].includes(x)) {
                loadOperator("SFREN");
            } else {
                loadOperator("SALAH");
            }
        }

        function loadOperator(nama) {
            if (opera != nama) {
                if (nama == "SALAH") {
                    var dataSalah = $("#dataProduk").html();
                    $("#textTop").html("");
                    $("#imgTop").attr("src", iconPilihan[0].signal);
                    $("#imgTop").addClass("my-bg p-1 text-white");
                    $("#boxPilihan").addClass("d-none");
                    $("#boxBtnLanjut").addClass("d-none");
                    if (dataSalah != noSalah) { $("#dataProduk").html(noSalah); }
                } else {
                    var v = urlKategori[0][nama];
                    $("#textTop").html(v.nama);
                    $("#imgTop").attr("src", v.gambar);
                    $("#imgTop").removeClass("my-bg p-1 text-white");
                    $("#boxBtnLanjut").removeClass("d-none");
                    currentCatData = v.data;
                    currentOperatorKey = nama;
                }
                opera = nama;
            }
        }

        $("#nomoId").on("input", function () {
            var val = $("#nomoId").val();
            if (val.length <= 3) {
                clearData();
                noX = ''; noY = '';
            } else if (val.length >= 6) {
                cekInputan(1);
            }
        });

        function cekInputan(type) {
            var val = $("#nomoId").val();
            var cleanVal = val.replace(/[^\d]/g, '');
            var finalVal = cekStr(cleanVal);
            $('#nomoId').val(finalVal);
            var no4 = cekStr(cleanVal).substr(0, 4);
            var no6 = cekStr(cleanVal).substr(0, 6);
            if (type == 1) {
                if (no4.length == 4 && noX != no4 || no6.length == 6 && noY != no6) {
                    noX = no4;
                    noY = no6;
                }
                cekNomorUlang(noX, noY);
            } else if (no4.length == 4 && noX != no4 || no6.length == 6 && noY != no6) {
                noX = no4;
                noY = no6;
                cekNomorUlang(noX, noY);
            }
        }

        function rubahData(nama) {
            $(".dropdown-item").removeClass("my-color");
            $("#pil-" + nama).addClass("my-color");
            $("#namaPil").html(nama);
            urutanProduk = nama;
            if (dataProduk != null) loopProduk(dataProduk, dataDesc);
        }

        function formatRupiah(angka) {
            var formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", minimumFractionDigits: 0 });
            return formatter.format(angka).replace(/IDR/g, "").trim();
        }

        clearData();
    </script>
</body>

</html>
